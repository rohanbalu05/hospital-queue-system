server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness of the proxy itself (used by the compose healthcheck).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SSE streams (queue events per session and the waiting-room display). Buffering and compression must stay off or
  # events are held back; the read timeout is long because the connection is idle between events (the API pings every 15 s).
  location ~ ^/api/(sessions/[^/]+/events|display/events)$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
  }

  # Everything else: /api/* -> api:3000/* (prefix stripped, D-013). client_max_body_size covers the 10 MB document limit.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_read_timeout 60s;
    client_max_body_size 12m;
  }

  # Hashed build assets are immutable; index.html must always be revalidated so a release is picked up.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}

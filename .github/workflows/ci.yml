name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hqms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hqms
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hqms_test
      HOSPITAL_TZ: Asia/Kolkata
      IDENTITY_PROVIDER: local
      OBJECT_STORAGE: local-disk
      OCR_PROVIDER: fake
      LLM_PROVIDER: fake
      SESSION_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Semgrep
        run: pip install semgrep
      - name: Create databases
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE hqms"
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed (once packages/db exists)
        run: |
          if [ -d packages/db ]; then pnpm db:migrate && pnpm db:seed; else echo "packages/db not present yet"; fi
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hqms_test
      - name: Verify (typecheck, lint, dependency-cruiser, tests, Semgrep)
        run: pnpm verify
      - name: Concurrency tests (real Postgres)
        run: pnpm test:concurrency
      - name: Coverage (v8) and summary
        run: pnpm coverage
      - name: Static analysis and unit-test evidence reports
        if: always()
        run: |
          pnpm evidence:static
          pnpm evidence:tests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            **/coverage/**
            docs/evidence/coverage-summary.json
            !**/node_modules/**
          if-no-files-found: ignore
      - name: Upload evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-reports
          path: |
            docs/evidence/static-analysis.md
            docs/evidence/unit-tests.md
          if-no-files-found: ignore

  # Build every app from a clean checkout, start the API from its built bundle against a Postgres service container
  # (migrate + seed first) and run the smoke script. This is the same artifact the Docker image runs.
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hqms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hqms
      HOSPITAL_TZ: Asia/Kolkata
      OBJECT_STORAGE: local-disk
      STORAGE_DIR: ${{ github.workspace }}/var/storage
      OCR_PROVIDER: fake
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build api, worker and web
        run: |
          pnpm --filter @hqms/api build
          pnpm --filter @hqms/worker build
          pnpm --filter @hqms/web build
      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Start API from dist and run the smoke script
        run: |
          PORT=3100 node apps/api/dist/main.js > api.log 2>&1 &
          API_PID=$!
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3100/health >/dev/null 2>&1 && break
            sleep 1
          done
          status=0
          API_URL=http://localhost:3100 pnpm smoke || status=$?
          kill "$API_PID" || true
          if [ "$status" -ne 0 ]; then echo "--- api.log (tail) ---"; tail -n 40 api.log; fi
          exit "$status"

  # Build the compose demo images and prove the stack comes up healthy and passes the smoke script through the nginx proxy.
  compose-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    env:
      HQMS_WEB_PORT: '5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start the demo stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the web proxy
        run: API_URL=http://localhost:5173/api node scripts/smoke.mjs
      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 80
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Playwright flows. Browsers may be unavailable on some runners, so a failure here is reported but does not block the
  # merge (continue-on-error); the evidence in docs/evidence/ is what counts, not this job's colour.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hqms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hqms
      HOSPITAL_TZ: Asia/Kolkata
      OBJECT_STORAGE: local-disk
      STORAGE_DIR: ${{ github.workspace }}/var/storage
      OCR_PROVIDER: fake
      LLM_PROVIDER: fake
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @hqms/tests exec playwright install --with-deps chromium
      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Start api, worker and web
        run: |
          pnpm --filter @hqms/api build
          pnpm --filter @hqms/worker build
          PORT=3000 node apps/api/dist/main.js > api.log 2>&1 &
          node apps/worker/dist/main.js > worker.log 2>&1 &
          pnpm --filter @hqms/web dev > web.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/health >/dev/null 2>&1 && curl -fsS http://localhost:5173/ >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Playwright flows
        run: |
          if [ -d tests/e2e ]; then pnpm e2e; else echo "tests/e2e not present yet"; fi
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            docs/evidence/screenshots/**
            api.log
            worker.log
            web.log
          if-no-files-found: ignore
